<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gold Bar logo — navy background, gold header bar -->

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1a0d2e"/>

  <!-- Gold border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#c9aa71" stroke-width="8"/>

  <!-- Gold header bar top shape -->
  <rect x="0" y="0" width="512" height="178" rx="96" fill="#c9aa71"/>
  <!-- Fill the lower part of the rounded top so it looks like a flat bottom bar -->
  <rect x="0" y="114" width="512" height="64" fill="#c9aa71"/>

  <!-- DRAFT text in bar -->
  <text x="256" y="143"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="86" font-weight="700"
    fill="#1a0d2e">DRAFT</text>

  <!-- XI — large gold serif -->
  <text x="256" y="360"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="196" font-weight="700"
    fill="#c9aa71">XI</text>

  <!-- Divider line -->
  <line x1="80" y1="388" x2="432" y2="388" stroke="#c9aa71" stroke-width="2" opacity="0.4"/>

  <!-- FOOTBALL tagline -->
  <text x="256" y="440"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28" font-weight="700"
    fill="#c9aa71" letter-spacing="10" opacity="0.6">FOOTBALL</text>
</svg>
