<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#07070f"/>
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="96" fill="url(#glow)" opacity="0.6"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00bb7f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00bb7f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- GX monogram — clean, readable at 16px -->
  <text
    x="256" y="318"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="258"
    font-weight="900"
    letter-spacing="-10"
    fill="#00bb7f">GX</text>
  <!-- Thin underline accent -->
  <rect x="136" y="350" width="240" height="6" rx="3" fill="#00bb7f" opacity="0.35"/>
</svg>
