<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0e0e14;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 80px;
    position: relative;
  }

  /* Subtle pitch lines in background */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% 50%, rgba(0,187,127,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Decorative arc lines like a pitch */
  .pitch-bg {
    position: absolute; inset: 0;
    opacity: 0.06;
  }

  .left {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 20px;
    z-index: 1;
  }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,187,127,0.15);
    border: 1px solid rgba(0,187,127,0.4);
    border-radius: 999px;
    padding: 6px 16px;
    width: fit-content;
    color: #00bb7f;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .title {
    font-size: 88px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -2px;
  }

  .title span {
    color: #00bb7f;
  }

  .subtitle {
    font-size: 26px;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    letter-spacing: 0.3px;
    margin-top: 4px;
  }

  .stats {
    display: flex; gap: 40px;
    margin-top: 12px;
  }

  .stat {
    display: flex; flex-direction: column; gap: 2px;
  }

  .stat-num {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
  }

  .stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .divider {
    width: 1px; height: 48px;
    background: rgba(255,255,255,0.1);
    align-self: center;
  }

  .url {
    margin-top: 8px;
    font-size: 16px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.5px;
  }

  /* Right side: formation badge */
  .right {
    flex-shrink: 0;
    width: 340px;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }

  .badge {
    width: 280px; height: 320px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  .badge svg {
    width: 100%; height: 100%;
  }

  .formation-grid {
    position: absolute;
    inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    padding: 60px 30px 50px;
  }

  .row {
    display: flex; gap: 14px; justify-content: center;
  }

  .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,187,127,0.9);
    box-shadow: 0 0 10px rgba(0,187,127,0.5);
  }

  .dot.gk {
    background: rgba(255,200,50,0.9);
    box-shadow: 0 0 10px rgba(255,200,50,0.5);
  }
</style>
</head>
<body>

<div class="left">
  <div class="tag">⚽ Pick Your XI</div>
  <div class="title">Draft<span> XI</span></div>
  <div class="subtitle">Build your all-time starting eleven</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num">93</div>
      <div class="stat-label">Nations</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-num">153</div>
      <div class="stat-label">Clubs</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-num">76yr</div>
      <div class="stat-label">History</div>
    </div>
  </div>
  <div class="url">draft-11.com</div>
</div>

<div class="right">
  <div class="badge">
    <!-- Shield shape -->
    <svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a1a28"/>
          <stop offset="100%" stop-color="#0e0e14"/>
        </linearGradient>
        <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00bb7f" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#00bb7f" stop-opacity="0.2"/>
        </linearGradient>
      </defs>
      <!-- Shield fill -->
      <path d="M140 12 L268 56 L268 180 Q268 270 140 308 Q12 270 12 180 L12 56 Z"
            fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
      <!-- Inner line -->
      <path d="M140 22 L258 64 L258 180 Q258 262 140 298 Q22 262 22 180 L22 64 Z"
            fill="none" stroke="rgba(0,187,127,0.12)" stroke-width="1"/>
    </svg>
    <!-- Formation dots 4-3-3 -->
    <div class="formation-grid">
      <!-- GK -->
      <div class="row">
        <div class="dot gk"></div>
      </div>
      <!-- DEF 4 -->
      <div class="row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <!-- MID 3 -->
      <div class="row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <!-- FWD 3 -->
      <div class="row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <!-- XI text -->
      <div style="color: rgba(0,187,127,0.4); font-size: 13px; font-weight: 700; letter-spacing: 4px; margin-top: 4px;">4 · 3 · 3</div>
    </div>
  </div>
</div>

</body>
</html>
