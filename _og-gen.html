<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0e0e14;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 80px;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 900px 500px at 50% 50%, rgba(201,170,113,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .left {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 20px;
    z-index: 1;
  }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(201,170,113,0.12);
    border: 1px solid rgba(201,170,113,0.4);
    border-radius: 999px;
    padding: 6px 16px;
    width: fit-content;
    color: #c9aa71;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .title {
    font-size: 88px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -2px;
  }

  .title span {
    color: #c9aa71;
  }

  .subtitle {
    font-size: 26px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
    margin-top: 4px;
  }

  .stats {
    display: flex; gap: 40px;
    margin-top: 12px;
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 32px; font-weight: 700; color: #ffffff; }
  .stat-label { font-size: 13px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
  .divider { width: 1px; height: 48px; background: rgba(255,255,255,0.1); align-self: center; }

  .url { margin-top: 8px; font-size: 16px; color: rgba(255,255,255,0.25); }

  .right {
    flex-shrink: 0;
    width: 300px;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }

  .logo-badge {
    width: 240px; height: 240px;
    border-radius: 46px;
    overflow: hidden;
    border: 3px solid #c9aa71;
    box-shadow: 0 0 60px rgba(201,170,113,0.2);
  }
</style>
</head>
<body>

<div class="left">
  <div class="tag">⚽ Pick Your XI</div>
  <div class="title">Draft<span> XI</span></div>
  <div class="subtitle">Build your all-time starting eleven</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num">93</div>
      <div class="stat-label">Nations</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-num">153</div>
      <div class="stat-label">Clubs</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-num">76yr</div>
      <div class="stat-label">History</div>
    </div>
  </div>
  <div class="url">draft-11.com</div>
</div>

<div class="right">
  <div class="logo-badge">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="240" height="240">
      <rect width="512" height="512" fill="#1a0d2e"/>
      <rect x="0" y="0" width="512" height="178" rx="0" fill="#c9aa71"/>
      <rect x="0" y="114" width="512" height="64" fill="#c9aa71"/>
      <text x="256" y="143" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="86" font-weight="700" fill="#1a0d2e">DRAFT</text>
      <text x="256" y="360" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="196" font-weight="700" fill="#c9aa71">XI</text>
      <line x1="80" y1="388" x2="432" y2="388" stroke="#c9aa71" stroke-width="2" opacity="0.4"/>
      <text x="256" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#c9aa71" letter-spacing="10" opacity="0.6">FOOTBALL</text>
    </svg>
  </div>
</div>

</body>
</html>
