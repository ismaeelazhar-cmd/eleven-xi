<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <defs>
    <linearGradient id="shieldFill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2347"/>
      <stop offset="100%" stop-color="#141729"/>
    </linearGradient>
    <linearGradient id="goldBorder2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B97A"/>
      <stop offset="100%" stop-color="#A8893C"/>
    </linearGradient>
  </defs>

  <!-- Centered shield — same proportions as icon.svg but shifted to center of wider canvas -->
  <!-- Shield outer (gold border) -->
  <path d="M 320,16
    L 524,78
    L 524,283
    Q 522,358 320,478
    Q 118,358 116,283
    L 116,78
    Z"
    fill="url(#goldBorder2)"
  />

  <!-- Shield inner fill -->
  <path d="M 320,28
    L 512,86
    L 512,281
    Q 510,350 320,464
    Q 130,350 128,281
    L 128,86
    Z"
    fill="url(#shieldFill2)"
  />

  <!-- Inner outline -->
  <path d="M 320,30
    L 510,88
    L 510,280
    Q 508,348 320,462
    Q 132,348 130,280
    L 130,88
    Z"
    fill="none"
    stroke="#C9AA71"
    stroke-width="1"
    stroke-opacity="0.3"
  />

  <!-- Horizontal divider -->
  <line x1="154" y1="286" x2="486" y2="286" stroke="#C9AA71" stroke-width="1" stroke-opacity="0.4"/>

  <!-- XI -->
  <text
    x="320" y="262"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="188"
    font-weight="700"
    fill="#C9AA71"
    letter-spacing="-4"
  >XI</text>

  <!-- DRAFT below divider line -->
  <text
    x="320" y="282"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="30"
    font-weight="400"
    fill="#C9AA71"
    letter-spacing="10"
    opacity="0.9"
  >DRAFT</text>

  <!-- Formation dots -->
  <circle cx="320" cy="328" r="8.5" fill="none" stroke="#C9AA71" stroke-width="1.5" stroke-opacity="0.65"/>
  <circle cx="252" cy="356" r="7.5" fill="none" stroke="#C9AA71" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="388" cy="356" r="7.5" fill="none" stroke="#C9AA71" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="270" cy="396" r="7.5" fill="none" stroke="#C9AA71" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="370" cy="396" r="7.5" fill="none" stroke="#C9AA71" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="320" y1="328" x2="252" y2="356" stroke="#C9AA71" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="320" y1="328" x2="388" y2="356" stroke="#C9AA71" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="252" y1="356" x2="270" y2="396" stroke="#C9AA71" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="388" y1="356" x2="370" y2="396" stroke="#C9AA71" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="252" y1="356" x2="370" y2="396" stroke="#C9AA71" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="388" y1="356" x2="270" y2="396" stroke="#C9AA71" stroke-width="0.75" stroke-opacity="0.12"/>

  <!-- Wordmark below shield -->
  <!-- "DRAFT XI" ghost text -->
  <text
    x="320" y="520"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="68"
    font-weight="900"
    fill="#1A1A2E"
    letter-spacing="4"
    opacity="0.12"
  >DRAFT XI</text>

  <!-- Tagline -->
  <text
    x="320" y="548"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#888888"
    letter-spacing="5"
  >PICK YOUR XI · BUILD YOUR LEGACY</text>
</svg>
